<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="#0f172a" />

  <!-- Chat Bubble -->
  <path d="M60 70 
           Q60 50 80 50 
           L120 50 
           Q140 50 140 70 
           L140 100 
           Q140 120 120 120 
           L95 120 
           L75 140 
           L80 120 
           Q60 120 60 100 Z"
        fill="#facc15"/>

  <!-- Inner Chat Lines -->
  <rect x="75" y="70" width="50" height="6" rx="3" fill="#0f172a"/>
  <rect x="75" y="85" width="35" height="6" rx="3" fill="#0f172a"/>

  <!-- App Name -->
  <text x="100" y="170" text-anchor="middle" fill="#facc15" font-size="18" font-family="Arial, sans-serif">
    ChatHub
  </text>
</svg>
